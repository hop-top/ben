name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.23"]

    steps:
      - name: Checkout ben
        uses: actions/checkout@v4
        with:
          path: ben

      - name: Checkout kit
        uses: actions/checkout@v4
        with:
          repository: hop-top/kit
          path: kit

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: ben/go.sum

      - name: Create go.work
        run: |
          cat > go.work <<'EOF'
          go 1.23

          use (
            ./ben
            ./kit
          )
          EOF
          go work sync

      - name: go mod download
        working-directory: ben
        env:
          GOWORK: ${{ github.workspace }}/go.work
        run: go mod download

      - name: go build ./...
        working-directory: ben
        env:
          GOWORK: ${{ github.workspace }}/go.work
        run: go build ./...

      - name: go vet ./...
        working-directory: ben
        env:
          GOWORK: ${{ github.workspace }}/go.work
        run: go vet ./...

      - name: go test ./...
        working-directory: ben
        env:
          GOWORK: ${{ github.workspace }}/go.work
        run: go test -count=1 -race -coverprofile=coverage.out ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-go${{ matrix.go }}
          path: ben/coverage.out
          if-no-files-found: warn
